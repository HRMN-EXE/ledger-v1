name: Android APK

# Builds an installable release APK with no local toolchain required.
# Run it from the Actions tab (or `gh workflow run android-apk.yml`) and the
# APK shows up in the run's Artifacts — and, for tagged builds, in Releases.

on:
  workflow_dispatch:
  push:
    # main is the release branch; arena/** is the working branch this app was
    # built on, so pushing there also produces an APK to test with.
    branches: [main, "arena/**"]
    tags: ["v*"]

permissions:
  contents: write
  issues: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK on the runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Provisions Gradle and caches dependencies + the wrapper download, so a
      # flaky day on services.gradle.org cannot fail an otherwise good build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle.log

      # Gradle's failure output is uploaded even when the build fails, so the
      # error can be read without access to the raw run logs.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle.log
          if-no-files-found: ignore

      # …and mirrored into a dedicated issue, because run logs and artifacts
      # live behind a CDN that some networks cannot reach.
      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LOG=android/gradle.log
          [ -f "$LOG" ] || exit 0
          tail -c 40000 "$LOG" > /tmp/tail.txt
          { echo "Gradle failure on \`$GITHUB_SHA\`"; echo; echo '```'; cat /tmp/tail.txt; echo '```'; } > /tmp/body.md
          NUM=$(gh issue list --state open --search "CI build log" --json number,title -q '.[] | select(.title=="CI build log") | .number' | head -n1)
          if [ -z "$NUM" ]; then
            gh issue create --title "CI build log" --body-file /tmp/body.md >/dev/null
          else
            gh issue comment "$NUM" --body-file /tmp/body.md >/dev/null
          fi

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      # The APK has to actually contain the alarm machinery — a green build
      # that silently dropped the sounds would be worse than a red one.
      - name: Verify APK contents
        run: |
          set -e
          APK="${{ steps.apk.outputs.path }}"
          echo "::group::raw assets"
          unzip -l "$APK" | grep -E "res/raw/ledger_(alarm|chime|nudge)\.wav"
          echo "::endgroup::"

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -n1 || true)
          if [ -n "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK")
          else
            BADGING=$(unzip -p "$APK" AndroidManifest.xml | strings -e l || true)
          fi

          for PERM in USE_FULL_SCREEN_INTENT SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK FOREGROUND_SERVICE; do
            if ! printf '%s' "$BADGING" | grep -q "$PERM"; then
              echo "::error title=APK verification::missing permission $PERM"
              exit 1
            fi
          done

          for COMPONENT in RingActivity RingService AlarmReceiver RingActionReceiver BootReceiver; do
            if ! printf '%s' "$BADGING" | grep -q "$COMPONENT"; then
              echo "::error title=APK verification::missing component $COMPONENT"
              exit 1
            fi
          done
          echo "APK verified: alarm sounds, permissions and native components are present."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
