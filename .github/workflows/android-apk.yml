name: Android APK

# Builds an installable release APK with no local toolchain required.
# Run it from the Actions tab (or `gh workflow run android-apk.yml`) and the
# APK shows up in the run's Artifacts — and, for tagged builds, in Releases.

on:
  workflow_dispatch:
  push:
    # main is the release branch; arena/** is the working branch this app was
    # built on, so pushing there also produces an APK to test with.
    branches: [main, "arena/**"]
    tags: ["v*"]

permissions:
  contents: write
  issues: write

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK on the runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Provisions Gradle and caches dependencies + the wrapper download, so a
      # flaky day on services.gradle.org cannot fail an otherwise good build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle.log

      - name: Locate APK
        id: apk
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      # The APK has to actually contain the alarm machinery — a green build that
      # silently dropped the sounds would be worse than a red one. Every line is
      # also written to android/verify.log so the failure is readable from the
      # CI issue (see the publish step below).
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          LOG=android/verify.log
          : > "$LOG"
          say() { echo "$@"; echo "$@" >> "$LOG"; }

          say "APK: $APK ($(du -h "$APK" | cut -f1))"
          say "--- every .wav / raw / ledger entry in the APK ---"
          unzip -l "$APK" | grep -i -E "\.wav|res/raw|ledger" | tee -a "$LOG" || true
          say "--- end of listing ---"

          # The manifest's string pool holds every component name regardless of
          # how AGP shortened resource paths, so read it directly.
          STRINGS=$(unzip -p "$APK" AndroidManifest.xml | strings -e l || true)
          say "--- manifest entries that mention Ledger's alarm machinery ---"
          printf '%s\n' "$STRINGS" | grep -i -E "Receiver|Service|Activity" | sort -u | tee -a "$LOG" || true
          say "--- end of manifest entries ---"

          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -n1 || true)
          if [ -n "$AAPT" ]; then
            say "using $AAPT"
            PERMS=$("$AAPT" dump permissions "$APK")
          else
            PERMS="$STRINGS"
          fi

          fail=0
          if unzip -l "$APK" | grep -qi "\.wav"; then
            say "alarm sounds present"
          else
            say "MISSING: no .wav inside the APK at all"
            fail=1
          fi

          for PERM in USE_FULL_SCREEN_INTENT SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS; do
            if printf '%s' "$PERMS" | grep -q "$PERM"; then
              say "permission ok: $PERM"
            else
              say "MISSING permission: $PERM"
              fail=1
            fi
          done

          for COMPONENT in RingActivity RingService AlarmReceiver RingActionReceiver BootReceiver; do
            if printf '%s' "$STRINGS" | grep -q "$COMPONENT"; then
              say "component ok: $COMPONENT"
            else
              say "MISSING component: $COMPONENT"
              fail=1
            fi
          done

          if [ "$fail" != "0" ]; then
            echo "::error title=APK verification::The APK is missing alarm permissions or native components — see android/verify.log"
            exit 1
          fi
          say "APK verified."

          MERGED=$(find android/app/build/intermediates -name AndroidManifest.xml -path "*release*" | head -n1 || true)
          if [ -n "$MERGED" ]; then
            say "--- merged manifest ($MERGED) ---"
            grep -E "<activity|<service|<receiver|android:name=\"expo.modules" "$MERGED" >> "$LOG" || true
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Tagged builds become a release, so the APK has a stable download link
      # that does not require a GitHub login.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: |
            Ledger — offline day planner, streak keeper and alarm clock.

            Install `app-release.apk` on an Android phone (Android 7.0+). Signed with the
            React Native debug keystore, so it installs directly but is not Play-Store ready.

            First run: grant notifications, exact alarms and the battery exemption from
            **Settings → Permissions**, then use **Ring a test alarm now** to check the
            phone's own alarm behaviour — lock the screen, and try again after swiping
            Ledger out of recents.
          generate_release_notes: true

      # Gradle's failure output is uploaded even when the build fails, so the
      # error can be read without access to the raw run logs.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: |
            android/gradle.log
            android/verify.log
          if-no-files-found: ignore

      # …and mirrored into a dedicated issue, because run logs and artifacts
      # live behind a CDN that some networks cannot reach.
      - name: Publish build log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -f android/gradle.log ] || exit 0
          cat android/verify.log >> android/gradle.log 2>/dev/null || true
          tail -c 40000 android/gradle.log > /tmp/tail.txt
          { echo "Build failure on \`$GITHUB_SHA\`"; echo; echo '```'; cat /tmp/tail.txt; echo '```'; } > /tmp/body.md
          NUM=$(gh issue list --state open --search "CI build log" --json number,title -q '.[] | select(.title=="CI build log") | .number' | head -n1)
          if [ -z "$NUM" ]; then
            gh issue create --title "CI build log" --body-file /tmp/body.md >/dev/null
          else
            gh issue comment "$NUM" --body-file /tmp/body.md >/dev/null
          fi
